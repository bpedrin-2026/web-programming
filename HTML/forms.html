<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
    </head>

    <body>
        <h1>Forms</h1>
        <form action="https://www.webcoder.club/form-handler" method="post">
            <label for="name">Your Name:</label>
            <br>
            <input type="text" name="yourName" id="name">
            <br>
            <label for="favF">Favorite Food</label>
            <br>
            <select name="favoriteFood" id="favF">
                <option value="1">PIZZA</option>
                <option value="2">SPAGHETTI</option>
            </select>
            <br>
            <label for="favC">Favorite Color</label>
            <br>
            <input type="radio" name="color" id="" value="red">
            <label for="">RED</label>
            <input type="radio" name="color" id="" value="blue">
            <label for="">BLUE</label>
            <input type="radio" name="color" id="" value="green">
            <label for="">GREEN</label>
            <br>
            <input type="checkbox" name="terms" id="" value="agree">
            <label for="">Agree to Terms</label>
            <br>
            <label for="">Courses</label>
            <br>
            <label for="">
                <input type="checkbox" name="courses" id="" value="web1">
                Web 1
            </label>
            <input type="checkbox" name="courses" id="" value="cisco1">
            <label for="">Cisco 1</label>
        
            <br><br>
            <input type="submit" value="Save">
        </form>
    </body>

</html>
