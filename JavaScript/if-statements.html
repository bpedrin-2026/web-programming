<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>If Statements</title>

        <script>

            let input = prompt("Enter a number between 1 and 10:");

            if(input<4){
                console.log("True");
            }


            if(input<4){
                console.log("True");
            }else{
                console.log("False");
            }

            // Ladder If statements

            input = prompt("Enter a color:");

            if(input == "red"){
                console.log("Roses");
            }else if(input == "blue"){
                console.log("Sky");
            }else if(input == "Green"){
                console.log("Grass");
            }else{
                console.log("Unknown Color");
            }


            
            input = prompt("Enter your age:");

            if(input < 10){
                console.log("Very young!");
            }else if(input < 20){
                console.log("Young Adult!");
            }else{
                console.log("You must be old!")
            }



        </script>
    </head>
